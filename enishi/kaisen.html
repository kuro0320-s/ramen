<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>海鮮チーズ麺＿とろり＿高松店</title>

<style>
    h1{
        border-left: solid 7px #ff8c00;
        border-bottom: solid 3px #ff8c00;
        background-color:antiquewhite;
        padding: 10px;
    }

    .hub-btn{
        position: fixed;
        border-radius: 8px;
        z-index: 999;
        bottom: 35px;
        right: 20px;
        width: 7%;
        text-align: center;
        background-color: #0F5474;
        color: #fff;
        box-shadow: 0px 4px 6px #0f577980;
        transition: all 0.3s ease;
    }
    .hub-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 0px 6px 8px #0f5779cc;
    }

    .item {
        display: flex;
        gap: 30px;
        align-items: flex-start;
        margin-top: 20px;
    }


    .item img {
        width: 740px;
        height: 330px;
        border-radius: 10px;
        object-fit: cover;
    }
    .item{
        opacity: 0;
        transform: translateY(200px);
        transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .item.show{
        opacity: 1;
        transform: translateY(0);
    }


    .intro-modern {
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 12px;
        background: #fafafa;
        max-width: 400px;
        line-height: 1.7;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .intro-modern h2 {
        margin-top: 0;
        font-size: 22px;
        color: #333;
        border-bottom: 2px solid #ff8c00;
        display: inline-block;
        padding-bottom: 4px;
    }
    .map {
    margin-top: 30px;
    background: #fafafa;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ddd;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    max-width: 1500px;}
    .map h2 {
    margin-top: 0;
    font-size: 22px;
    color: #333;
    border-bottom: 2px solid #ff8c00;
    display: inline-block;
    padding-bottom: 4px;
    }
</style>
</head>

<body>

<h1>海鮮チーズ麺トロリ高松店</h1>


<a href="../index-main.html">
    <div class="hub-btn">
        <p style="font-size: 15px; font-weight: bold;">←<br>もどる</p>
    </div>
</a>

<div class="item">
    <img src="海鮮チーズ麺写真.png" alt="海鮮チーズ麺">

    <div class="intro-modern">
        <h2>～紹介～</h2>
        <p>濃厚な海鮮スープに、とろけるチーズが贅沢に絡む極上の一杯を提供する「海鮮チーズ麺トロリ高松店」。</p>
        <p>海の旨味をしっかり引き出したスープはコク深く、まろやかなチーズとの相性が抜群。</p>
        <p>食べ進めるほど味の変化が楽しめる、他では味わえない個性派ラーメンです。</p>
    </div>
</div>

<div class="map">
    <h2>～アクセス～</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3296.5945533235126!2d134.04848617481122!3d34.28438980543829!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3553eb2fef74a09b%3A0x4e11d8675453cca9!2z5rW36a6u44OB44O844K66bq6IOOBqOOCjeOCiiDpq5jmnb7lupc!5e0!3m2!1sja!2sjp!4v1784608414426!5m2!1sja!2sjp"
        width="100%"
        height="450"
        style="border:0; border-radius:12px;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</div>
<h2>公式SNS：
    <a href="https://www.instagram.com/torori_takamatsu?igsh=MXNhdXd5Zzg5NWE2bw=="><img src="instagram-icon.png" style="width: 3%;">海鮮チーズ麺トロリInstagram(インスタグラム)</a>
</h2>


    <script>

            const targets = document.querySelectorAll(".item");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                    } 
                });
            } , {
                threshold: 0.2
            });

            targets.forEach(target => observer.observe(target));

        </script>



</body>
</html>
