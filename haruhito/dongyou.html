<!DOCTYPE html>
<html lang="ja">
<head>
    <title>鈍餃</title>
    <style>

        .hub-btn{
            position: fixed;
            border-radius: 8px;
            z-index: 999;
            bottom: 35px;
            right: 20px;
            width: 7%;
            text-align: center;
            background-color: #0F5474;
            color: #fff;
            box-shadow: 0px 4px 6px #0f577980;
            transition: all 0.3s ease;
        }
        .hub-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 0px 6px 8px #0f5779cc;
        }

        .image{
            opacity: 0;
            transform: translateY(200px);
            transition: all 0.8s ease;
        }
        .image.show{
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>
    <h1>鈍餃</h1>

    <a href="../index-main.html">
        <div class="hub-btn">
            <p style="font-size: 15px; font-weight: bold;">←<br>もどる</p>
        </div>
    </a>

    <img src="image.jpg" width=640 height=330 class="image" alt="鈍餃の画像">
    <h2>鈍餃のおすすめポイント</h2>
    <ul>
        <li>ラーメンをはじめとしたさまざまな中華料理が楽しめる</li>
        <li>お手ごろなお値段でボリューム満点・味も申し分ない</li>
        <li>注文してから料理が運ばれるまでが短いのが良い</li>
    </ul>
    <h3>営業時間</h3>
    <p>11:00 - 15:00
        17:00 - 20:15
    </p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d1089779.491656553!2d133.2036648949!3d33.52011833258662!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3553c3571b67201f%3A0xd11a4643de432bbc!2z6aOp6aSD!5e0!3m2!1sja!2sus!4v1784699807746!5m2!1sja!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <script>

            const targets = document.querySelectorAll(".image");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                    }
                });
            } , {
                threshold: 0.2
            });

            targets.forEach(target => observer.observe(target));

        </script>


</body>
</html>
